<!DOCTYPE html> <!-- Define documento como HTML5 (HTML) -->
<html lang="es"> <!-- Idioma del contenido: español (HTML + accesibilidad) -->

<head> <!-- Información del documento, no visible (HTML) -->

    <meta charset="UTF-8"> <!-- Permite acentos y símbolos (HTML) -->
    <meta name="referrer" content="unsafe-url">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Diseño adaptable a móviles (HTML + CSS responsive) -->

    <link rel="manifest" href="manifest.json"> <!-- Conecta con manifiesto PWA (HTML + JS Service Worker) -->
    <meta name="theme-color" content="#6366f1"> <!-- Color de interfaz en modo app (HTML + PWA) -->

    <title>Comandos y Tutoriales</title> <!-- Título de la pestaña (HTML) -->

    <link rel="icon" type="image/png" href="img/iconos/favicon.png"> <!-- Ícono de pestaña (HTML) -->
    <link rel="apple-touch-icon" sizes="180x180" href="img/iconos/apple-touch-icon.png"> <!-- Ícono en iOS (HTML) -->
    <link rel="icon" type="image/png" sizes="32x32" href="img/iconos/favicon-32x32.png"> <!-- Favicon 32px (HTML) -->
    <link rel="icon" type="image/png" sizes="16x16" href="img/iconos/favicon-16x16.png"> <!-- Favicon 16px (HTML) -->

    <link rel="preconnect" href="https://fonts.googleapis.com"> <!-- Optimiza carga de fuentes (HTML rendimiento) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Conexión a servidor de fuentes (HTML rendimiento) -->

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700&family=Fira+Code&display=swap"
        rel="stylesheet"> <!-- Importa tipografías (HTML + CSS) -->

    <link rel="stylesheet" href="css/style.css"> <!-- Conecta hoja de estilos local (HTML → CSS) -->
    <link rel="stylesheet" href="css/optimizacion.css"> <!-- Clases utilitarias — generadas desde data.js -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Librería de íconos (HTML + CSS externo) -->
</head>

<body class="dark-mode"> <!-- Contenido visible + clase usada por CSS/JS para modo oscuro -->
    <canvas id="matrix-bg"></canvas> <!-- Lienzo para animación gráfica (HTML + JavaScript) -->

    <header> <!-- Encabezado principal (HTML estructural) -->
        <div class="header-content"> <!-- Contenedor para diseño del header (HTML + CSS) -->
            <h1>Guía de Comandos y Tutoriales</h1> <!-- Título principal (HTML + SEO) -->
            <p>Tu base de conocimiento para sistema de Windows.</p> <!-- Descripción del sitio (HTML) -->

            <div class="search-container"> <!-- Contenedor del buscador (HTML + CSS) -->
                <i class="fas fa-search"></i> <!-- Icono lupa (HTML + FontAwesome CSS) -->
                <label for="inputBusqueda" style="display:none;">Buscar comandos</label>
                <!-- Etiqueta accesible oculta (HTML) -->
                <input type="text" id="inputBusqueda" name="busqueda" placeholder="¿Qué comando necesitas hoy?">
                <!-- Campo de búsqueda usado por JS (HTML + JavaScript) -->
            </div>

            <div class="global-tools"> <!-- Contenedor de botones globales (HTML + CSS) -->

                <button onclick="toggleDarkMode()" data-tooltip="Cambiar Tema"> <!-- Ejecuta función JS (JavaScript) -->
                    <i class="fas fa-moon"></i> <!-- Icono modo oscuro (HTML + CSS) -->
                </button>

                <button onclick="irAlRepo()" data-tooltip="Repositorio">
                    <i class="fab fa-github"></i>
                </button>

                <button onclick="alert('Bienvenido a tu Guía de Comandos')" data-tooltip="Ayuda">
                    <!-- Muestra alerta JS -->
                    <i class="fas fa-question-circle"></i> <!-- Icono ayuda -->
                </button>

                <button id="btn-login" onclick="iniciarSesion()" data-tooltip="Entrar con Google">
                    <!-- Llama login JS -->
                    <i class="fas fa-user-circle"></i> <!-- Icono usuario -->
                </button>

                <!-- Botón EXCLUSIVO para cerrar sesión del sistema de acceso por correo -->
                <button id="btn-cerrar-acceso" onclick="cerrarAcceso()"
                    data-tooltip="Cerrar sesión"
                    style="color:#f59e0b; display:none;">
                    <i class="fas fa-lock-open"></i>
                </button>
            </div>
        </div>
    </header>

    <nav id="tabs-categorias">
        <!-- Las pestañas se generan automáticamente desde js/config.js →  CONFIG_CATEGORIAS -->
        <!-- Para agregar, quitar o cambiar una categoría, edita config.js, no este archivo -->
    </nav>

    <main> <!-- Contenido principal (HTML semántico) -->

        <section id="lista-recursos"></section> <!-- JS inserta contenido dinámico aquí -->
    </main>

    <div id="modal-tutorial" class="modal hidden"> <!-- Modal oculto con CSS, controlado por JS -->

        <div class="modal-blur-overlay" onclick="cerrarTutorial()"></div> <!-- Fondo que cierra modal (JS) -->

        <div class="modal-contenido animate-pop-in"> <!-- Caja del modal + animación CSS -->

            <button class="cerrar-modal" onclick="cerrarTutorial()" aria-label="Cerrar tutorial">
                <!-- Botón cerrar (JS + accesibilidad) -->
                <i class="fas fa-times"></i> <!-- Icono X -->
            </button>

            <div id="tutorial-cuerpo" class="print-area"></div> <!-- JS inserta tutorial aquí -->
        </div>
    </div>

    <!-- ── MODAL CERRAR SESIÓN — va aquí para cubrir toda la pantalla ── -->
    <div id="modal-cerrar-acceso" style="
        display:none; position:fixed; inset:0; z-index:99999;
        align-items:center; justify-content:center;">
        <!-- Fondo oscuro -->
        <div onclick="cancelarCerrarAcceso()" style="
            position:absolute; inset:0;
            background:rgba(0,0,0,0.75);
            backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px);"></div>
        <!-- Caja centrada -->
        <div style="
            position:relative; z-index:1;
            background:linear-gradient(135deg,#1e293b,#0f172a);
            border:1px solid rgba(245,158,11,0.3);
            border-radius:20px;
            padding:2rem 2rem 1.5rem;
            max-width:360px; width:90%;
            box-shadow:0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(245,158,11,0.1);
            text-align:center;
            font-family:'Inter',sans-serif;">
            <div style="
                width:64px; height:64px; border-radius:50%;
                background:rgba(245,158,11,0.15);
                border:2px solid rgba(245,158,11,0.4);
                display:flex; align-items:center; justify-content:center;
                margin:0 auto 1.2rem;
                font-size:1.6rem; color:#f59e0b;">
                <i class="fas fa-lock-open"></i>
            </div>
            <h3 style="color:#f1f5f9; font-family:'Poppins',sans-serif; font-size:1.1rem; margin-bottom:0.5rem;">
                ¿Cerrar sesión?
            </h3>
            <p style="color:#94a3b8; font-size:0.85rem; line-height:1.6; margin-bottom:1.5rem;">
                Tendrás que volver a iniciar sesión con tu cuenta aprobada para acceder.
            </p>
            <div style="display:flex; gap:10px; justify-content:center;">
                <button onclick="cancelarCerrarAcceso()" style="
                    flex:1; padding:0.6rem 1rem;
                    background:rgba(255,255,255,0.06);
                    border:1px solid rgba(255,255,255,0.1);
                    border-radius:10px; color:#94a3b8;
                    font-family:'Inter',sans-serif; font-size:0.85rem;
                    cursor:pointer;">
                    Cancelar
                </button>
                <button onclick="confirmarCerrarAcceso()" style="
                    flex:1; padding:0.6rem 1rem;
                    background:linear-gradient(135deg,#f59e0b,#d97706);
                    border:none; border-radius:10px; color:#fff;
                    font-family:'Inter',sans-serif; font-size:0.85rem;
                    font-weight:600; cursor:pointer;
                    box-shadow:0 4px 15px rgba(245,158,11,0.3);">
                    Sí, cerrar sesión
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="js/javascript.js" defer></script> <!-- Carga archivo JS principal -->

    <script>
        // ── REGISTRO DEL SERVICE WORKER ──────────────────────────
        // Se registra aquí (en HTML normal, no en módulo) porque
        // necesita ejecutarse lo antes posible, antes que el módulo JS.
        //
        // "serviceWorker" en navigator → el navegador soporta SW
        // Solo funciona en HTTPS o localhost (no en file://)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register('/sw.js')  // ← el archivo que creamos
                    .then(registro => {
                        console.log('[SW] Registrado correctamente:', registro.scope);
                    })
                    .catch(error => {
                        // No es un error crítico — el portal sigue funcionando
                        // solo sin modo offline
                        console.warn('[SW] No se pudo registrar:', error);
                    });
            });
        }
    </script>

    <div id="contenedor-subir"> <!-- Contenedor botón subir -->
        <span id="contador-tarjetas" title="Total de resultados">0</span> <!-- Contador actualizado por JS -->
        <button id="btn-subir" title="Volver arriba"> <!-- Botón scroll arriba (JS) -->
            <i class="fas fa-chevron-up"></i> <!-- Icono flecha -->
        </button>
    </div>
</body>

</html>
